name: tag-check

# 发版前/发版时的版本号一致性校验。
# 目标：杜绝 v2.1.2 那种「APK 是 20006、README 写 20001、源码写 20005」的分叉。

on:
  push:
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取 build.gradle.kts 版本号唯一真源
        id: v
        run: |
          CODE=$(grep -oP '^val appVersionCode\s*=\s*\K[0-9]+' src/app/build.gradle.kts)
          NAME=$(grep -oP '^val appVersionName\s*=\s*"\K[^"]+' src/app/build.gradle.kts)
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "::error::build.gradle.kts 顶部缺少 appVersionCode / appVersionName 唯一真源"
            exit 1
          fi
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "真源：$CODE / $NAME"

      - name: README 版本横幅一致
        run: |
          grep -q "version-anchor: ${{ steps.v.outputs.name }} (${{ steps.v.outputs.code }})" README.md \
            || { echo "::error::README 的 <!-- version-anchor: --> 与真源不一致（期望 ${{ steps.v.outputs.name }} (${{ steps.v.outputs.code }})）"; exit 1; }
          grep -q "（versionCode ${{ steps.v.outputs.code }}）" README.md \
            || { echo "::error::README 版本横幅未更新"; exit 1; }

      - name: 状态快照一致
        run: |
          grep -qF "| versionCode | **${{ steps.v.outputs.code }}** |" docs/状态快照.md \
            || { echo "::error::docs/状态快照.md 的 versionCode 未同步"; exit 1; }

      - name: tag 名必须是 VersionCode-VersionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECT="${{ steps.v.outputs.code }}-${{ steps.v.outputs.name }}"
          if [ "$TAG" != "$EXPECT" ]; then
            echo "::error::tag 名为 $TAG，应为 $EXPECT（Xposed-Modules-Repo 要求 tag = VersionCode-VersionName）"
            exit 1
          fi

      - name: 隐私扫描（真实昵称/手机号关键词）
        run: |
          # 示例会话名必须是匿名化的 XXX / YYY；只抓「独立成串」的 11 位手机号
          #（前后不能是数字，否则时间戳 1794928557000、签名 l=2026... 之类会误报）。
          if grep -rnE '(^|[^0-9])1[3-9][0-9]{9}([^0-9]|$)' README.md docs/ 2>/dev/null; then
            echo "::error::发现疑似手机号，请匿名化后再发版"
            exit 1
          fi
          echo "隐私扫描通过"
